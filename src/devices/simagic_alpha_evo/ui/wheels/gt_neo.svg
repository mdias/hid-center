  </g>
  <g id="layer-surfaces" inkscape:groupmode="layer" inkscape:label="Surfaces">
    <path id="band" class="band on-body" clip-path="url(#body-clip)" d="M 0 8 L -44 8 C -45.33 8 -46.52 8.42 -47.56 9.26 L -96.44 48.74 C -97.48 49.58 -97.48 50.42 -96.44 51.25 L -89.56 56.75 C -88.52 57.58 -87.48 57.59 -86.43 56.76 L -41.57 21.24 C -40.52 20.41 -39.33 20 -38 20 L 0 20 L 38 20 C 39.33 20 40.52 20.41 41.57 21.24 L 86.43 56.76 C 87.48 57.59 88.52 57.58 89.56 56.75 L 96.44 51.25 C 97.48 50.42 97.48 49.58 96.44 48.74 L 47.56 9.26 C 46.52 8.42 45.33 8 44 8 Z"/>
    <path id="panel_seam_left" class="seam on-body" d="M -58 -44 L -58 -4 L -46 8"/>
    <use xlink:href="#panel_seam_left" transform="matrix(-1,0,0,1,0,0)"/>
    <path id="grip_left" class="grip on-body" clip-path="url(#body-clip)" d="M -127.3 -61.7 L -118 -53 L -104 -36 L -93 -18 L -90 8 L -97 30 L -88.5 47 L -77.8 67.8 L -70 100 L -170 100 L -170 -70 Z"/>
    <use xlink:href="#grip_left" transform="matrix(-1,0,0,1,0,0)"/>
    <path id="thumb_housing_left" class="housing" d="M -92 -28 C -92 -30 -91 -31 -89 -31 L -72 -31 C -68.67 -31 -66 -29.67 -64 -27 C -62 -24.33 -61.62 -21.45 -62.86 -18.36 L -65.14 -12.64 C -66.38 -9.55 -68.65 -7.8 -71.96 -7.4 L -89.02 -5.36 C -91.01 -5.12 -92 -6 -92 -8 Z"/>
    <use xlink:href="#thumb_housing_left" transform="matrix(-1,0,0,1,0,0)"/>
  </g>
  <g id="layer-controls" inkscape:groupmode="layer" inkscape:label="Controls">
