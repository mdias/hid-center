    <g id="button_arm_top_left" class="button" style="fill:#eef0f4">
      <title>Left arm, top button</title>
      <circle id="button_arm_top_left-shape" cx="-107.5" cy="-67.4" r="8.25"/>
    </g>
    <g id="button_arm_middle_left" class="button" style="fill:#4a6cff">
      <title>Left arm, middle button</title>
      <circle id="button_arm_middle_left-shape" cx="-88.5" cy="-59.2" r="8.25"/>
    </g>
    <g id="button_arm_bottom_left" class="button" style="fill:#b36bff">
      <title>Left arm, bottom button</title>
      <circle id="button_arm_bottom_left-shape" cx="-77" cy="-41.5" r="8.25"/>
    </g>
    <g id="button_side_left" class="button glyph-arrow-left" style="fill:#ffe23a">
      <title>Left side button</title>
      <circle id="button_side_left-shape" cx="-76.2" cy="0.2" r="7.75"/>
      <text x="-76.2" y="0.2">◀</text>
    </g>
    <g id="button_lower_left" class="button" style="fill:#35e05c">
      <title>Left lower button</title>
      <circle id="button_lower_left-shape" cx="-71.2" cy="26" r="8.25"/>
      <text x="-71.2" y="26">EXIT</text>
    </g>
    <rect id="thumb_encoder_left" class="thumb-encoder" x="-88.5" y="-28.75" width="9" height="21.5">
      <title>Left thumb encoder</title>
    </rect>
    <circle id="switch_7way_left" class="seven-way-switch" cx="-54.7" cy="-2.3" r="7.5">
      <title>Left 7-way switch</title>
    </circle>
    <g id="encoder_upper_left" class="rotary-encoder" style="fill:#ff7a1a">
      <title>Upper-left encoder</title>
      <circle id="encoder_upper_left-shape" cx="-26.7" cy="-18" r="14"/>
    </g>
    <g id="encoder_lower_left" class="rotary-encoder" style="fill:#e6ecff">
      <title>Lower-left encoder</title>
      <circle id="encoder_lower_left-shape" cx="-23.4" cy="35.6" r="13.5"/>
    </g>
    <g id="button_arm_top_right" class="button" style="fill:#ffa21f">
      <title>Right arm, top button</title>
      <use xlink:href="#button_arm_top_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
      <text x="107.5" y="-67.4">PIT</text>
    </g>
    <g id="button_arm_middle_right" class="button" style="fill:#35e05c">
      <title>Right arm, middle button</title>
      <use xlink:href="#button_arm_middle_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
      <text x="88.5" y="-59.2">DRS</text>
    </g>
    <g id="button_arm_bottom_right" class="button" style="fill:#26b8ff">
      <title>Right arm, bottom button</title>
      <use xlink:href="#button_arm_bottom_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
      <text x="77" y="-41.5">KERS</text>
    </g>
    <g id="button_side_right" class="button glyph-arrow-right" style="fill:#ffe23a">
      <title>Right side button</title>
      <use xlink:href="#button_side_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
      <text x="76.2" y="0.2">▶</text>
    </g>
    <g id="button_lower_right" class="button glyph-power" style="fill:#ff3b30">
      <title>Right lower button</title>
      <use xlink:href="#button_lower_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
      <text x="71.2" y="26">⏻</text>
    </g>
    <use id="thumb_encoder_right" xlink:href="#thumb_encoder_left" transform="matrix(-1,0,0,1,0,0)">
      <title>Right thumb encoder</title>
    </use>
    <use id="switch_7way_right" xlink:href="#switch_7way_left" transform="matrix(-1,0,0,1,0,0)">
      <title>Right 7-way switch</title>
    </use>
    <g id="encoder_upper_right" class="rotary-encoder" style="fill:#3d7bff">
      <title>Upper-right encoder</title>
      <use xlink:href="#encoder_upper_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
    </g>
    <g id="encoder_lower_right" class="rotary-encoder" style="fill:#b54dff">
      <title>Lower-right encoder</title>
      <use xlink:href="#encoder_lower_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
    </g>
  </g>
</svg>
