<!--
  SIMAGIC GT Neo, seen from the driver's seat.

  Traced from reference images of the wheel, scaled to its 300 mm width.

  Millimetres on the real wheel, origin at its centre, +y down. What the ids,
  classes and titles mean, and how to edit this file: "Layouts are SVG files" in
  src/devices/simagic_alpha_evo/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="320mm" height="180mm" viewBox="-160 -90 320 180"
     data-wheel-id="6">
  <title>GT Neo</title>
  <style>
    /* The editor preview's shades. The app draws with its own, from
       WheelSchematic.cpp, and takes nothing from this block. */
    text { font-family: sans-serif; font-weight: bold; text-anchor: middle;
           dominant-baseline: central; stroke: none; }
    .body { fill-rule: evenodd; clip-rule: evenodd; stroke: #80818a; stroke-width: 1;
            stroke-linejoin: round; }
    .grip { fill: #2a2a2e; }
    .carbon { fill: #37383d; }
    .plate { fill: #222327; }
    .housing { fill: #242428; }
    .band { fill: #43444a; }
    .carbon, .plate, .housing, .band { stroke: #5e5f66; stroke-width: 0.3; }
    [clip-path] { stroke: none; }
    .seam { fill: none; stroke: #242529; stroke-width: 0.45; stroke-linecap: round; }
    .stitch { fill: none; stroke: #cf2d2d; stroke-width: 0.55; stroke-dasharray: 1.8 1.4; }
    .see-through .body { fill-opacity: 0.3; stroke-opacity: 0.6; }
    .see-through .on-body { opacity: 0.6; }
    .shift-paddle, .clutch-paddle { fill: #4b4c52; stroke: #7c7d84; stroke-width: 0.45;
                                    stroke-linejoin: round; }
    .optional { fill-opacity: 0.4; stroke-dasharray: 2 1; }
    .button, .rotary-encoder, .seven-way-switch { fill: #2f3035; stroke: #45464c; stroke-width: 0.3; }
    .button text, .rotary-encoder text { fill: #141416; font-size: 3.2px; }
    .thumb-encoder { fill: #cc222c; stroke: #6e0e14; stroke-width: 0.3; }
    .recess { fill: #0d0d0f; stroke: #45464c; stroke-width: 0.3; }
    .lit-label rect { fill: #c9cacf; stroke: #7a7b82; stroke-width: 0.3; }
    .lit-label text, .label text { fill: #141416; font-size: 5.6px; }
  </style>
  <defs>
    <clipPath id="body-clip"><use xlink:href="#body"/></clipPath>
  </defs>
  <g id="layer-paddles" inkscape:groupmode="layer" inkscape:label="Paddles">
    <g id="paddle_shift_left" class="shift-paddle">
      <title>Left shift paddle (down)</title>
      <path id="paddle_shift_left-shape" d="M -105 -30 C -105 -32 -104.26 -33.67 -102.77 -35.01 L -102.23 -35.49 C -100.74 -36.83 -99 -37.54 -97 -37.61 L -88 -37.93 C -86.67 -37.98 -85.35 -37.86 -84.05 -37.57 L -68 -34 L -68 -12 L -103 -12 C -104.33 -12 -105 -12.67 -105 -14 Z"/>
    </g>
    <g id="paddle_shift_right" class="shift-paddle">
      <title>Right shift paddle (up)</title>
      <use xlink:href="#paddle_shift_left-shape" transform="matrix(-1,0,0,1,0,0)"/>
    </g>
    <path id="paddle_clutch_left" class="clutch-paddle" d="M -105.76 29.99 C -105.92 28 -105.26 26.32 -103.79 24.97 L -102.21 23.53 C -100.74 22.18 -99 21.41 -97.01 21.22 L -84 20 L -68 20 L -68 52 L -101 52 C -103 52 -104.08 51 -104.24 49.01 Z">
      <title>Left clutch paddle</title>
    </path>
    <use id="paddle_clutch_right" xlink:href="#paddle_clutch_left" transform="matrix(-1,0,0,1,0,0)">
      <title>Right clutch paddle</title>
    </use>
  </g>
