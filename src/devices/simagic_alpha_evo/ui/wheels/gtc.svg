<!--
  SIMAGIC GTC, seen from the driver's seat.

  Traced from front-on reference photographs of the wheel, scaled to its
  325 mm width. The centre-plate knobs are encoders and the pod knobs 7-way
  switches on the owner's word; nothing else says which is which.

  Each button's data-led is the LED slot that lights it. Which physical button
  is which slot was found on a real GTC, by giving every button a different
  colour and seeing where each one lit. Its data-input is the mapping byte that
  pairs with that slot, so it is placed by the same test.

  The ABS and TC windows take the two slots that are left, 8 and 9, which are
  filled ABS first. That they
  light the printed word rather than the roller under it is the owner's word.

  The data-input of each encoder, roller and 7-way switch names the mapping byte
  of each thing it does. Which of the parts is
  which control, and which way is up on a roller, is a guess until each is
  turned or pushed on a real GTC with the Wheel tab's pressed buttons showing.

  Millimetres on the real wheel, origin at its centre, +y down. What the ids,
  classes and titles mean, and how to edit this file: "Layouts are SVG files" in
  src/devices/simagic_alpha_evo/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="340mm" height="280mm" viewBox="-170 -140 340 280"
     class="see-through" data-wheel-id="4">
  <title>GTC</title>
  <style>
    /* The editor preview's shades. The app draws with its own, from
       WheelSchematic.cpp, and takes nothing from this block. */
    text { font-family: sans-serif; font-weight: bold; text-anchor: middle;
           dominant-baseline: central; stroke: none; }
    .body { fill-rule: evenodd; clip-rule: evenodd; stroke: #80818a; stroke-width: 1;
            stroke-linejoin: round; }
    .grip { fill: #2a2a2e; }
    .carbon { fill: #37383d; }
    .plate { fill: #222327; }
    .housing { fill: #242428; }
    .band { fill: #43444a; }
    .carbon, .plate, .housing, .band { stroke: #5e5f66; stroke-width: 0.3; }
    [clip-path] { stroke: none; }
    .seam { fill: none; stroke: #242529; stroke-width: 0.45; stroke-linecap: round; }
    .stitch { fill: none; stroke: #cf2d2d; stroke-width: 0.55; stroke-dasharray: 1.8 1.4; }
    .see-through .body { fill-opacity: 0.3; stroke-opacity: 0.6; }
    .see-through .on-body { opacity: 0.6; }
    .shift-paddle, .clutch-paddle { fill: #4b4c52; stroke: #7c7d84; stroke-width: 0.45;
                                    stroke-linejoin: round; }
    .optional { fill-opacity: 0.4; stroke-dasharray: 2 1; }
    .button, .rotary-encoder, .seven-way-switch { fill: #2f3035; stroke: #45464c; stroke-width: 0.3; }
    .button text, .rotary-encoder text { fill: #141416; font-size: 3.2px; }
    .thumb-encoder { fill: #cc222c; stroke: #6e0e14; stroke-width: 0.3; }
    .recess { fill: #0d0d0f; stroke: #45464c; stroke-width: 0.3; }
    .lit-label rect { fill: #c9cacf; stroke: #7a7b82; stroke-width: 0.3; }
    .lit-label text, .label text { fill: #141416; font-size: 5.6px; }
  </style>
  <defs>
    <clipPath id="body-clip"><use xlink:href="#body"/></clipPath>
  </defs>
